apiVersion: apps/v1
kind: Deployment
metadata:
  name: vendor-a-vulnerable
spec:
  replicas: 1
  selector:
    matchLabels:
      app: vendor-a
  template:
    metadata:
      labels:
        app: vendor-a
    spec:
      nodeSelector:
        kubernetes.io/hostname: tprm-lab-worker
      containers:
      - name: nginx-vuln
        image: nginx:1.23-alpine
        ports:
        - containerPort: 80
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vendor-b-clean
spec:
  replicas: 1
  selector:
    matchLabels:
      app: vendor-b
  template:
    metadata:
      labels:
        app: vendor-b
    spec:
      nodeSelector:
        kubernetes.io/hostname: tprm-lab-worker-2
      containers:
      - name: nginx-clean
        image: nginx:1.25-alpine
        ports:
        - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: vendor-services
spec:
  selector:
    app: vendor-a
  ports:
  - port: 80
  type: ClusterIP
